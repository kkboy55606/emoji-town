<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>表情小鎮</title>
<meta name="theme-color" content="#fdf6e3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1a14" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="表情小鎮">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --H:100dvh;--Hmax:none;
  --bg:#fdf6e3;--panel:#fffdf6;--line:#eadfc2;--text:#3b3226;--dim:#8a7c66;
  --accent:#ff9f43;--accent-d:#e8832a;--good:#4caf50;--bad:#e5484d;
  --soil:#d9b48a;--soil2:#c89b6d;--cell:#f3e9cf;--cell2:#eadcb8;--shadow:0 2px 0 #00000014;
  color-scheme:light;
  /* 手機的瀏海 / 底部手勢列：Artifact 外殼也會加同樣的值，重複宣告不會疊加 */
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1d1a14;--panel:#2a251c;--line:#3d3526;--text:#f3ead8;--dim:#a99c84;--soil:#6b4c30;--soil2:#5b4128;--cell:#332d21;--cell2:#3d3526;--shadow:0 2px 0 #0006;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#1d1a14;--panel:#2a251c;--line:#3d3526;--text:#f3ead8;--dim:#a99c84;--soil:#6b4c30;--soil2:#5b4128;--cell:#332d21;--cell2:#3d3526;--shadow:0 2px 0 #0006;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overscroll-behavior:none;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

#app{height:100%;max-height:var(--Hmax);max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  padding-inline:16px}
#top{flex:none;display:flex;align-items:center;gap:8px;padding:10px 0 6px}
#coins{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow);font-size:20px}
#coins b{font-variant-numeric:tabular-nums;min-width:2ch}
.spacer{flex:1}
.tb{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--panel);font-size:20px;padding:0;box-shadow:var(--shadow)}
.tb:active{transform:translateY(1px)}
.dot{position:absolute;top:5px;right:5px;width:11px;height:11px;border-radius:50%;background:var(--bad);border:2px solid var(--panel)}
#hint{flex:none;min-height:30px;padding:2px 4px 6px;font-size:14px;color:var(--dim);text-align:center}
#hint:not(:empty){color:var(--text)}
#views{flex:1;min-height:0;position:relative}
.view{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;overflow:auto;padding-bottom:6px}

/* ---- 花園 ---- */
#seeds{display:flex;gap:6px;width:min(100%,420px);flex:none;padding-top:10px}
.seed{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:6px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:var(--shadow)}
.seed b{font-size:24px;font-weight:400}
.seed small{font-size:11px;color:var(--dim)}
.seed.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.seed.lock{opacity:.5}
#plots{display:grid;grid-template-columns:repeat(var(--cols,3),1fr);gap:8px;width:min(100%,420px,calc((var(--H) - 330px) * var(--cols,3) / var(--rows,3)));touch-action:none;flex:none}
.plot{position:relative;aspect-ratio:1;border:0;border-radius:18px;padding:0;overflow:hidden;
  background:radial-gradient(circle at 30% 25%,var(--soil),var(--soil2));box-shadow:inset 0 -4px 0 #0000001f,var(--shadow);touch-action:none}
.plot .pe{position:absolute;inset:0 0 8px;display:grid;place-items:center;font-size:calc(var(--pw,80px) * .52);transform:scale(var(--s,1));transition:transform .25s;pointer-events:none}
.plot.empty::after{content:"＋";position:absolute;inset:0;display:grid;place-items:center;font-size:28px;color:#ffffff88;pointer-events:none}
.plot .pb{position:absolute;left:12%;right:12%;bottom:7px;height:6px;border-radius:3px;background:#0003;overflow:hidden;pointer-events:none}
.plot .pb i{display:block;height:100%;background:#ffe08a;transition:width .1s linear}
.plot.ripe{box-shadow:0 0 0 3px #ffd84d,0 0 18px #ffd84dcc,inset 0 -4px 0 #0000001f}
.plot.ripe .pe{animation:bounce .9s ease-in-out infinite}
.plot.ripe .pb i{background:#7be87b}
.plot.pop .pe{animation:pop .3s}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6%) scale(1.08)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
#gfoot{display:flex;gap:8px;width:min(100%,420px);flex:none}
.btn{flex:1;border:0;border-radius:14px;padding:11px 10px;font-weight:700;font-size:15px;background:var(--accent);color:#3a2300;box-shadow:0 3px 0 var(--accent-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--accent-d)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:var(--shadow)}
.btn:disabled,.btn.off{opacity:.45}
#boardInfo,#autoInfo{flex:none;font-size:13px;color:var(--dim);text-align:center;min-height:18px}

/* ---- 合成盤 ---- */
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,420px,calc((var(--H) - 390px) * 5 / 6));touch-action:none;flex:none}
.cell{position:relative;aspect-ratio:1;border-radius:14px;background:var(--cell);box-shadow:inset 0 2px 0 #00000012}
.item{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw,60px) * .62);border-radius:14px;touch-action:none;cursor:grab}
.item .t{position:absolute;right:5px;bottom:2px;font-size:calc(var(--cw,60px) * .2);font-weight:800;color:var(--dim);pointer-events:none}
.item.max{background:radial-gradient(circle,#ffe08a99,transparent 70%)}
.cell.sel{outline:3px solid var(--accent);outline-offset:-1px;background:var(--cell2)}
.cell.match{animation:pulse .8s ease-in-out infinite}
.cell.dragging .item{opacity:.25}
.cell.merged .item{animation:pop .35s}
@keyframes pulse{0%,100%{outline:3px solid #4caf5000}50%{outline:3px solid #4caf50}}
#mergebar{display:flex;gap:8px;width:min(100%,420px);flex:none}
#mergebar .btn{flex:none;width:112px;padding:0 8px;font-size:14px}
#sellzone{flex:1;min-width:0;height:52px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:16px;font-weight:700;color:var(--dim);background:var(--panel)}
#sellzone.over{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 18%,var(--panel))}
.dragghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-60%) scale(1.15);font-size:44px;filter:drop-shadow(0 6px 6px #0004)}

/* ---- 底部分頁 ---- */
#tabs{flex:none;display:flex;gap:4px;padding:6px 0 8px}
.tab{position:relative;flex:1;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px 0 5px;display:flex;flex-direction:column;align-items:center;line-height:1.15;box-shadow:var(--shadow)}
.tab b{font-size:22px;font-weight:400}
.tab small{font-size:11px;color:var(--dim)}
.tab.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.tab.on small{color:var(--text);font-weight:700}
.tab.lock{opacity:.5}
.tab.lock::after{content:"🔒";position:absolute;top:1px;right:4px;font-size:11px}

/* ---- 浮字 / 提示 ---- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:20px;color:var(--text);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg),0 0 6px var(--bg);animation:rise .9s ease-out forwards;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-20%)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-190%)}}
#toast{position:fixed;left:50%;top:max(70px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;z-index:90;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:.95}

/* ---- Modal ---- */
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:14px;z-index:80}
#modal.on{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px;width:min(100%,440px);max-height:100%;overflow:auto;-webkit-user-select:text;user-select:text}
.card h2{margin:0 0 8px;font-size:22px;text-align:center}
.card p{margin:6px 0;font-size:14px;color:var(--dim);line-height:1.6}
.card .big{font-size:52px;text-align:center;line-height:1.1}
.card .btn{display:block;width:100%;margin-top:10px}
.card textarea{width:100%;height:96px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:8px;font-size:12px;word-break:break-all;-webkit-user-select:text;user-select:text}
.up{display:flex;align-items:center;gap:10px;padding:10px;margin:8px 0;border:1px solid var(--line);border-radius:16px;background:var(--bg)}
.up .ue{font-size:30px;width:40px;text-align:center}
.up .ub{flex:1;min-width:0;line-height:1.35}
.up .ub b{font-size:16px}
.up .ub small{display:block;font-size:12px;color:var(--dim)}
.up .btn{width:auto;margin:0;padding:9px 12px;white-space:nowrap;flex:none}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;font-size:20px;margin:8px 0}
.row{display:flex;gap:8px}

/* ---- 商店 ---- */
#shopHead{width:min(100%,420px);display:flex;justify-content:space-between;align-items:center;flex:none;font-size:13px;color:var(--dim)}
#stars{font-size:18px;letter-spacing:1px;color:var(--text)}
#stars small{font-size:12px;color:var(--dim);margin-left:4px;letter-spacing:0}
#lane{width:min(100%,420px);height:100px;display:flex;gap:8px;align-items:flex-end;flex:none;padding-top:14px}
#lane:empty::before{content:"店裡沒有客人… 😴";margin:auto;color:var(--dim);font-size:14px}
.cust{position:relative;flex:1;min-width:0;max-width:78px;height:80px;border-radius:16px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation}
.cust .face{font-size:30px;line-height:1;margin-top:6px}
.cust .bub{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:0 6px;font-size:17px;white-space:nowrap;line-height:1.35}
.cust .pat{position:absolute;left:8px;right:8px;bottom:6px;height:5px;border-radius:3px;background:#0002;overflow:hidden}
.cust .pat i{display:block;height:100%;background:var(--good)}
.cust.ok{border-color:var(--good)}
.cust.ok .bub{border-color:var(--good)}
.cust.warn .pat i{background:var(--bad)}
.cust.noble{border-color:#d4a017}
.cust.thief{border-color:var(--bad);animation:wiggle .35s infinite}
@keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
#shelves{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(100%,420px);flex:none}
.shelf{position:relative;aspect-ratio:1;border-radius:16px;border:2px dashed var(--line);background:var(--cell);padding:0;display:grid;place-items:center;font-size:calc(var(--sw,70px) * .5)}
.shelf.full{border-style:solid;background:var(--panel);box-shadow:var(--shadow)}
.shelf .tpl{opacity:.28}
.shelf .plus{font-size:26px;color:var(--dim)}
.shelf .t{position:absolute;right:6px;top:3px;font-size:12px;font-weight:800;color:var(--dim)}
.shelf .pr{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-size:11px;font-weight:700;color:var(--dim)}
.shelf .em{display:block;transform:translateY(-4px)}
#shopBtns{display:flex;gap:8px;width:min(100%,420px);flex:none}
#shopInfo{flex:none;font-size:13px;color:var(--dim);text-align:center;min-height:18px;width:min(100%,420px)}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.pk{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:6px 0;display:flex;flex-direction:column;align-items:center;line-height:1.25;font-size:28px}
.pk small{font-size:11px;color:var(--dim)}
.up-h{margin:14px 2px 2px;font-size:13px;font-weight:700;color:var(--dim)}

/* ---- 客人需求導向 ---- */
.seed{position:relative}
.seed .need{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;font-weight:800;background:var(--accent);color:#3a2300;border-radius:9px;padding:1px 6px;white-space:nowrap;box-shadow:var(--shadow)}
.cell.want{box-shadow:inset 0 0 0 3px #ff9f4388}
#needBar{width:min(100%,420px);display:flex;align-items:center;gap:8px;flex:none}
#needTxt{flex:1;min-width:0;font-size:13px;line-height:1.35}
#needBar .btn{flex:none;width:112px;padding:8px;font-size:13px}
.recipe{font-size:20px;text-align:center;padding:10px;margin:8px 0;border-radius:14px;background:var(--bg);line-height:1.7}

/* 寬螢幕（桌面瀏覽器、被拉得很高的視窗）：遊戲高度上限 800px，不要被拉成幾千像素高；手機不受影響 */
@media (min-width:700px){:root{--H:min(100dvh,800px);--Hmax:800px}}

/* ---- 冒險 ---- */
#qTop{width:min(100%,420px);display:flex;flex-direction:column;gap:8px;flex:none}
#areas{display:flex;gap:6px}
.qarea{flex:1;min-width:0;border:2px solid var(--line);border-radius:14px;background:var(--panel);padding:5px 2px;display:flex;flex-direction:column;align-items:center;line-height:1.2;box-shadow:var(--shadow)}
.qarea b{font-size:22px;font-weight:400}
.qarea small{font-size:11px;color:var(--dim)}
.qarea.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.qarea.lock{opacity:.5}
#stageDots{display:flex;gap:4px;justify-content:center}
#stageDots i{flex:1;max-width:34px;height:20px;border-radius:7px;background:var(--cell);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--dim)}
#stageDots i.done{background:color-mix(in srgb,var(--good) 55%,var(--cell))}
#stageDots i.cur{outline:3px solid var(--accent);outline-offset:1px}
#field{width:min(100%,420px);display:flex;flex-direction:column;gap:10px;flex:none;border-radius:20px;padding:12px;background:linear-gradient(var(--cell),var(--cell2));border:1px solid var(--line)}
#mobs{display:flex;gap:8px;justify-content:center;min-height:104px;align-items:flex-end}
#mobs .rest{align-self:center;color:var(--dim);font-size:14px}
.mob{position:relative;width:78px;height:92px;border-radius:16px;border:2px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;box-shadow:var(--shadow);touch-action:manipulation}
.mob .me{font-size:38px;line-height:1}
.mob.boss{width:96px;height:104px;border-color:var(--bad)}
.mob.boss .me{font-size:50px}
.mob.dead{opacity:.25;filter:grayscale(1)}
.hpb{display:block;width:80%;height:6px;border-radius:3px;background:#0003;overflow:hidden;margin-top:6px}
.hpb i{display:block;height:100%;background:var(--bad);transition:width .15s}
.hero .hpb i{background:var(--good)}
#qInfo{text-align:center;font-size:13px;color:var(--dim);min-height:34px;line-height:1.45}
#heroes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hero{position:relative;border:2px solid var(--line);border-radius:16px;background:var(--panel);padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);min-width:0}
.hero .hr{font-size:30px;line-height:1.1}
.hero .hl{font-size:11px;color:var(--dim);font-weight:700}
.hero .hg{display:flex;gap:3px;margin-top:5px}
.hero .hg u{text-decoration:none;font-size:13px;width:19px;height:19px;border-radius:6px;background:var(--cell);display:grid;place-items:center;color:var(--dim)}
.hero.down{filter:grayscale(1);opacity:.55}
.hero.add{border-style:dashed;color:var(--dim);justify-content:center;gap:2px;font-size:11px;box-shadow:none}
.hero.add b{font-size:26px;font-weight:400}
#qBtns{display:flex;gap:8px;width:min(100%,420px);flex:none}
#qBtns .btn{padding:11px 4px;font-size:14px}
.slotrow{margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.slotrow .sr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.slotrow .sr b{min-width:40px}
.slotrow .sr .gn{flex:1;min-width:0;font-size:14px;line-height:1.35}
.slotrow .sr .gn small{display:block;font-size:12px;color:var(--dim)}
.mini{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px;font-weight:700}
.cands{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cand{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:4px 10px;font-size:22px;line-height:1.3}
.cand small{font-size:11px;color:var(--dim);display:block;text-align:center}
.hstats{display:flex;gap:14px;justify-content:center;font-weight:700;margin:6px 0}
.xpb{height:8px;border-radius:4px;background:var(--cell);overflow:hidden}
.xpb i{display:block;height:100%;background:#6ea8ff}
.float.dmg{color:#e5484d}
.float.heal{color:#2e9e4a}
.float.gold{color:#c98600}
.foodq{display:flex;gap:8px;margin:8px 0}
.foodq button{flex:1;height:56px;border-radius:14px;border:2px dashed var(--line);background:var(--bg);font-size:28px}
.foodq button.on{border-style:solid}

/* ---- 離線很久回來：補算期間顯示的「計算中」畫面 ---- */
#boot{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
#boot .big{font-size:64px;animation:bootspin 2.4s linear infinite}
#boot p{margin:0;color:var(--dim);font-size:15px}
@keyframes bootspin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#boot .big{animation:none}}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="coins"><span class="ic">💰</span><b id="coinN">0</b></div>
    <div class="spacer"></div>
    <button id="bUp" class="tb" aria-label="升級">⬆️<i class="dot" hidden></i></button>
    <button id="bSet" class="tb" aria-label="設定">⚙️</button>
  </header>
  <div id="hint"></div>
  <main id="views">
    <section id="v-garden" class="view">
      <div id="seeds"></div>
      <div id="plots"></div>
      <div id="gfoot">
        <button id="bExpand" class="btn"></button>
        <button id="bAll" class="btn ghost"></button>
      </div>
      <div id="boardInfo"></div>
    </section>
    <section id="v-shop" class="view" hidden>
      <div id="shopHead"><span id="stars"></span><span id="shopStat"></span></div>
      <div id="lane"></div>
      <div id="shelves"></div>
      <div id="shopBtns">
        <button id="bRestock" class="btn">🔄 補貨</button>
        <button id="bTakeAll" class="btn ghost">📥 全部取回</button>
      </div>
      <div id="shopInfo"></div>
    </section>
    <section id="v-quest" class="view" hidden>
      <div id="qTop"><div id="areas"></div><div id="stageDots"></div></div>
      <div id="field">
        <div id="mobs"></div>
        <div id="qInfo"></div>
        <div id="heroes"></div>
      </div>
      <div id="qBtns">
        <button id="bForge" class="btn">🔨 鍛造</button>
        <button id="bFood" class="btn ghost">🍽️ 補給</button>
        <button id="bRecruit" class="btn ghost">👥 招募</button>

    // 說明列

  $('#areas').addEventListener('click', e => {

  const afterAdv = () => { advEls.heroSig = ''; advEls.mobSig = ''; boardKey = ''; flush(); renderQuest(); renderTop(); };

  function openHero(id) {
    const A = G.adv, h = A.heroes.find(x => x.id === id); if (!h) return;

      html += ts.length ? `<div class="cands">${ts.map(t => `<button class="cand" data-a="eq:${slot}:${t}">${SER[ser].tiers[t - 1]}<small>×${by[t].length}　${gearStat(ser, t).split('、')[0]}</small></button>`).join('')}</div>`
        : `<p style="margin:6px 0 0;font-size:12px">合成盤上沒有${ET.SLOT_NAME[slot]}可以穿（到 🔨 鍛造，或在冒險中掉落）</p>`;

      else if (op === 'off') { const r = ET.unequip(G, h.id, slot); if (!r.ok) msg = '合成盤滿了，放不下'; }

  function openFood() {

    const F = A.food, by = {};

    const keys = Object.keys(by).sort((a, b) => { const [sa, ta] = a.split(':'), [sb, tb] = b.split(':'); return sa < sb ? -1 : sa > sb ? 1 : ta - tb; });

    h += `<div class="foodq">${[0, 1, 2].map(i => F.queue[i] ? `<button class="on" data-a="un:${i}">${tierEmoji(F.queue[i].s, F.queue[i].t)}</button>` : `<button disabled>·</button>`).join('')}</div><p style="font-size:12px;margin-top:0">排隊中的料理（點一下取回合成盤）</p>`;
    h += keys.length ? keys.map(k => { const [s, t] = k.split(':'); return `<div class="up"><div class="ue">${tierEmoji(s, +t)}</div><div class="ub"><b>${SER[s].names[t - 1]} ×${by[k].length}</b><small>${foodText(s, +t)}</small></div><button class="btn${F.queue.length >= ET.FOOD_QUEUE ? ' off' : ''}" data-a="pk:${k}">放進去</button></div>`; }).join('')

  // ---------- 頂部 ----------
  let lastCoins = -1, hintLast = '';
  function renderTop() {

    if (tabs[3] && G.unlocked.quest) { const d = tabs[3].querySelector('.dot'); if (d) d.hidden = !(tab !== 'quest' && questDot()); }
    if (tabs[2] && G.unlocked.shop) { const d = tabs[2].querySelector('.dot'); if (d) d.hidden = !(tab !== 'shop' && G.shop.custs.some(c => c.kind === 'thief' || !ET.canServe(G, c))); }

  // ---------- 事件（core 產生，UI 播動畫） ----------
  function flush() {
    for (const e of G.ev) {
      switch (e.t) {
        case 'harvest': floatAt(plotEls[e.i], '+' + SER[ET.CROPS[e.crop].series].tiers[0]); SND.harvest(); plotCache[e.i] = null; break;
        case 'plant': SND.plant(); plotCache[e.i] = null; break;
        case 'boost': floatAt(plotEls[e.i], '⏩', -8); SND.boost(); break;
        case 'merge': {
          SND.merge(e.tier);
          const c = tab === 'merge' && boardEl.children[e.to];
          if (c) { floatAt(c, SER[e.s].tiers[e.tier - 1] + '!'); }
          mergedCell = e.to; break;
        }
        case 'sell': floatAt(sellEl, '+' + fmt(e.v) + ' 💰'); SND.sell(); break;
        case 'buy': case 'expand': SND.buy(); break;
        case 'unlock': toast(e.tab === 'shop' ? '🏪 商店開張了！去商店把東西上架' : e.tab === 'quest' ? '⚔️ 冒險開放了！先到冒險頁鍛造一把武器' : '⚗️ 合成台解鎖了！'); SND.unlock(); buildTabs(); break;
        case 'hit': if (tab === 'quest' && G.adv) {
          if (e.side === 'enemy') floatAt(advEls.mobEls[e.i], '-' + e.dmg, -6, 'dmg');
          else floatAt(advEls.heroEls[G.adv.heroes.findIndex(h => h.id === e.hid)], '-' + e.dmg, -6, 'dmg');
        } break;
        case 'heal': if (tab === 'quest' && G.adv) floatAt(advEls.heroEls[G.adv.heroes.findIndex(h => h.id === e.hid)], '+' + e.v, -6, 'heal'); break;
        case 'advwin': if (tab === 'quest') { floatAt($('#mobs'), '+💰' + fmt(e.coins), 0, 'gold'); SND.sell(); } break;
        case 'advlose': if (tab === 'quest') { toast('💀 全滅了…退一關，休息一下再來'); SND.lose(); } break;
        case 'drop': toast(`🎁 掉落 ${tierEmoji(e.s, e.tier)}，在合成盤上`); SND.unlock(); break;
        case 'lvl': if (tab === 'quest' && G.adv) { const hh = G.adv.heroes.find(x => x.id === e.hid); if (hh) toast(`⬆️ ${ET.ROLES[hh.role].name} 升到 Lv.${e.lvl}`); } break;
        case 'sale': floatAt(tab === 'shop' && shelfEls[e.slot] ? shelfEls[e.slot] : $('#coins'), '+' + fmt(e.total) + ' 💰' + (e.tip ? ' 小費' : '')); SND.sell(); break;
        case 'lost': if (tab === 'shop') floatAt(laneEl, '😞'); break;
        case 'stolen': toast(`🦹 偷走了 ${tierEmoji(e.s, e.tier)}！下次點他趕走，或雇 🛎️ 店員`); break;
        case 'chase': floatAt(laneEl, e.auto ? '🛎️💨' : '💨'); break;
        case 'toast': toast(e.text); break;
        case 'full': toast('📦 合成盤滿了！去合成或賣出'); break;
      }
    }
    G.ev.length = 0;
  }
  let mergedCell = -1;

  // ---------- 升級 / 設定 / 離線 modal ----------
  function openUpgrades() {

      if (!head) { h += `<div class="up-h">${title}</div>`; head = true; }

      const l = G.up[u.id], maxed = l >= u.max, c = ET.upgradeCost(G, u.id);
      h += `<div class="up"><div class="ue">${u.emoji}</div><div class="ub"><b>${u.name}${u.max > 1 && l > 0 ? ' Lv.' + l : ''}</b><small>${maxed ? '✅ 已滿級 — ' : ''}${u.desc(l)}</small></div>` +
        (maxed ? '' : `<button class="btn${G.coins < c ? ' off' : ''}" data-a="buy:${u.id}">💰${fmt(c)}</button>`) + '</div>';

  }
  function encode(s) { return btoa(unescape(encodeURIComponent(s))); }

          <button class="btn" data-a="copy">複製</button><button class="btn ghost" data-a="back">返回</button>`, (b) => {
          if (b === 'back') openSettings();
          else if (b === 'copy') { const t = $('#code'); t.select(); try { navigator.clipboard.writeText(t.value); toast('已複製'); } catch (e) { document.execCommand && document.execCommand('copy'); toast('已複製'); } }
        });
      } else if (a === 'import') {
        showModal(`<h2>📥 匯入存檔碼</h2><p>貼上之前匯出的存檔碼。會覆蓋目前的進度！</p><textarea id="code"></textarea>
          <button class="btn" data-a="go">匯入</button><button class="btn ghost" data-a="back">返回</button>`, (b) => {
          if (b === 'back') openSettings();

            let g = null;

            if (!g) { toast('存檔碼不正確'); return; }
            G = g; save(); resetUI(); closeModal(); toast('匯入完成');
          }
        });
      } else if (a === 'reset') {
        if (el.dataset.sure) { G = ET.newState(Date.now()); save(); resetUI(); closeModal(); toast('已重置'); }
        else { el.dataset.sure = 1; el.textContent = '⚠️ 再按一次確認（無法復原）'; }
      }
    });
  }
  function openOffline(s) {
    const hv = Object.keys(s.harvested).map(c => `<span>${ET.CROPS[c].emoji} ×${s.harvested[c].toLocaleString()}</span>`).join('');
    let h = `<div class="big">☀️</div><h2>歡迎回來！</h2><p style="text-align:center">你不在的 ${fmtDur(s.rawSec)}${s.capped ? `（只算 ${fmtDur(s.sec)}）` : ''}：</p>`;
    if (hv) h += `<div class="sum">${hv}</div>`;
    else h += `<p style="text-align:center">作物熟了，但沒人收成 😢<br>到 ⬆️ 升級買 🚜 農夫，下次離線也會幫你收。</p>`;
    if (s.merges || s.sold) h += `<p style="text-align:center">合成 ${s.merges.toLocaleString()} 次${s.sold ? `、賣出區賣了 ${s.sold.toLocaleString()} 件` : ''}</p>`;
    if (s.shopSales) h += `<p style="text-align:center">🏪 商店賣出 ${s.shopSales.toLocaleString()} 件，營收 💰${fmt(s.shopRevenue)}${s.shopLost ? `；${s.shopLost.toLocaleString()} 位客人沒買到就走了` : ''}${s.shopStolen ? `；被偷了 ${s.shopStolen} 件 🦹` : ''}</p>`;
    else if (G.unlocked.shop && s.shopLost) h += `<p style="text-align:center">🏪 貨架空了，${s.shopLost.toLocaleString()} 位客人沒買到就走了。雇 🛎️ 店員可以自動補貨。</p>`;
    if (s.earned) h += `<p style="text-align:center;font-size:18px;color:var(--text)"><b>總共賺了 💰${fmt(s.earned)}</b></p>`;
    if (s.advStages) h += `<p style="text-align:center">⚔️ 冒險隊打了 ${s.advStages.toLocaleString()} 關，帶回 💰${fmt(s.advCoins)}${s.advDefeats ? `；全滅 ${s.advDefeats.toLocaleString()} 次` : ''}${s.advLevels ? `；英雄共升了 ${s.advLevels} 級` : ''}${s.advDrops ? `；掉了 ${s.advDrops} 件裝備 🎁` : ''}</p>`;
    if (s.capped) h += `<p style="text-align:center">離線最多累積 ${ET.offlineCapHours(G)} 小時，可以在 ⬆️ 升級提高。</p>`;
    h += '<button class="btn" data-a="ok">收下</button>';
    showModal(h, () => closeModal());
  }

  $('#bUp').addEventListener('click', () => { if (!modalOpen) openUpgrades(); });
  $('#bSet').addEventListener('click', () => { if (!modalOpen) openSettings(); });

  // ---------- 版面尺寸 ----------
  function resize() {
    const p = plotEls[0]; if (p) $('#plots').style.setProperty('--pw', p.clientWidth + 'px');
    const sw = shelvesEl.firstChild; if (sw) shelvesEl.style.setProperty('--sw', sw.clientWidth + 'px');
    const c = boardEl.firstChild; if (c) boardEl.style.setProperty('--cw', c.clientWidth + 'px');
    else boardEl.style.setProperty('--cw', Math.min(boardEl.clientWidth, 420) / 5 + 'px');
  }
  addEventListener('resize', resize);

  function resetUI() {
    cancelDrag();
    selId = null; plotEls = []; plotCache = []; seedKey = ''; boardKey = ''; hintLast = ''; lastCoins = -1; tab = 'garden';
    laneIds = ''; shelfSig = ''; advEls.areaSig = advEls.mobSig = advEls.heroSig = advEls.info = ''; DM = G.unlocked.shop ? ET.demand(G) : [];
    showView('garden');
    buildTabs(); buildPlots(); renderGarden(); renderTop();
  }

  // ---------- 主迴圈 ----------
  let last = Date.now(), saveT = 0;
  function loop() {
    const now = Date.now(), gap = (now - last) / 1000;
    last = now;
    if (gap < 0) return;                   // 系統時間倒退：不給收益
    if (gap > 5) {                         // 分頁在背景被凍結：用離線補算
      const s = ET.offline(G, gap);
      if (s && gap >= 30 && !modalOpen) { s.rawSec = gap; openOffline(s); }
      plotCache = []; boardKey = '';
    } else ET.tick(G, gap);
    flush();
    DM = G.unlocked.shop ? ET.demand(G) : [];
    renderGarden(); renderBoard(); renderShop(); renderQuest(); renderAuto(); renderTop();
    if (mergedCell >= 0) { const c = boardEl.children[mergedCell]; if (c) { c.classList.add('merged'); setTimeout(() => c.classList.remove('merged'), 360); } mergedCell = -1; }
    saveT += gap; if (saveT >= 10) { saveT = 0; save(); }
  }
  document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  addEventListener('pagehide', save);
  addEventListener('beforeunload', save);
  document.addEventListener('freeze', save);

  // ---------- 啟動 ----------
  loadPref();
  let bootOffline = null;
  function start(loaded, gap) {
    if (loaded) {
      G = loaded;
      if (gap >= 1) { bootOffline = ET.offline(G, gap); if (bootOffline) bootOffline.rawSec = gap; }
      G.ev.length = 0;
    } else G = ET.newState(Date.now());
    last = Date.now();
    resetUI();
    save();
    setInterval(loop, 100);
    $('#boot').hidden = true;
    if (bootOffline && bootOffline.sec >= 30) openOffline(bootOffline);
  }
  const saved = lsGet(KEY);
  const loadedG = saved ? ET.load(saved) : null;
  const bootGap = loadedG ? ET.offlineSeconds(loadedG, Date.now()) : 0;
  if (bootGap >= 1800) {      // 離線超過 30 分鐘：補算要一點時間，先顯示「計算中」，等畫面畫出來再開始算
    $('#boot').hidden = false;
    requestAnimationFrame(() => setTimeout(() => start(loadedG, bootGap), 30));
  } else start(loadedG, bootGap);
  window.__town = { get G() { return G; }, ET };
})();

</script>
<script>
(function () {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  var reloading = false, hadController = !!navigator.serviceWorker.controller;
  // 只有「換版」才重新載入；第一次安裝時 service worker 接手不需要重載
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController) { hadController = true; return; }
    if (reloading) return; reloading = true; location.reload();
  });
  function banner(reg) {
    if (document.getElementById('updbar')) return;
    var b = document.createElement('button');
    b.id = 'updbar'; b.textContent = '🔄 有新版本，點這裡更新';
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 8px);z-index:100;background:#ff9f43;color:#3a2300;border:0;border-radius:999px;padding:10px 18px;font:700 14px system-ui,sans-serif;box-shadow:0 4px 14px #0004;cursor:pointer';
    b.onclick = function () { b.textContent = '更新中…'; if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING'); else location.reload(); };
    document.body.appendChild(b);
  }
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    if (reg.waiting && navigator.serviceWorker.controller) banner(reg);
    reg.addEventListener('updatefound', function () {
      var w = reg.installing; if (!w) return;
      w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) banner(reg); });
    });
    var check = function () { try { reg.update(); } catch (e) {} };
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(function () {});
  // 申請「永久儲存」：存檔比較不容易被瀏覽器清掉（已安裝的 PWA 通常會被允許）
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
})();
</script>
