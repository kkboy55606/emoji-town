<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>表情小鎮</title>
<meta name="theme-color" content="#fdf6e3">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div id="coins"><span class="ic">💰</span><b id="coinN">0</b></div>
    <div class="spacer"></div>
    <button id="bUp" class="tb" aria-label="升級">⬆️<i class="dot" hidden></i></button>
    <button id="bSet" class="tb" aria-label="設定">⚙️</button>
  </header>
  <div id="hint"></div>
  <main id="views">
    <section id="v-garden" class="view">
      <div id="seeds"></div>
      <div id="plots"></div>
      <div id="gfoot">
        <button id="bExpand" class="btn"></button>
        <button id="bAll" class="btn ghost"></button>
      </div>
      <div id="boardInfo"></div>
    </section>
    <section id="v-shop" class="view" hidden>
      <div id="shopHead"><span id="stars"></span><span id="shopStat"></span></div>
      <div id="lane"></div>
      <div id="shelves"></div>
      <div id="shopBtns">
        <button id="bRestock" class="btn">🔄 補貨</button>
        <button id="bTakeAll" class="btn ghost">📥 全部取回</button>
      </div>
      <div id="shopInfo"></div>
    </section>
    <section id="v-quest" class="view" hidden>
      <div id="qTop"><div id="areas"></div><div id="stageDots"></div></div>
      <div id="field">
        <div id="mobs"></div>
        <div id="qInfo"></div>
        <div id="heroes"></div>
      </div>
      <div id="qBtns">
        <button id="bForge" class="btn">🔨 鍛造</button>
        <button id="bFood" class="btn ghost">🍽️ 補給</button>
        <button id="bRecruit" class="btn ghost">👥 招募</button>
      </div>
    </section>
    <section id="v-merge" class="view" hidden>
      <div id="board"></div>
      <div id="mergebar">
        <div id="sellzone"><span id="sellTxt">💰 把東西拖到這裡賣出</span></div>
        <button id="bMergeAll" class="btn">✨ 一鍵合成</button>
      </div>
      <div id="needBar" hidden><span id="needTxt"></span><button id="bNeed" class="btn">🎯 為客人備貨</button></div>
      <div id="autoInfo"></div>
    </section>
  </main>
  <nav id="tabs"></nav>
  <div id="modal"></div>
</div>
<div id="fx"></div>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/shop.js"></script>
<script src="js/adventure.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
